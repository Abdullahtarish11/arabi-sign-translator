<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ترجمة لغة الإشارة - عبدالله طارش</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
<style>
body{font-family:system-ui;background:#0f172a;color:#fff;text-align:center;padding:12px}
video{width:100%;max-width:380px;border-radius:18px;background:#000;border:3px solid #22c55e}
#result{font-size:52px;margin:12px;background:#1e293b;padding:18px;border-radius:14px;border:2px solid #22c55e}
.btn{padding:14px;width:100%;border:none;border-radius:12px;font-size:17px;margin:6px 0}
.card{background:#1e293b;padding:12px;border-radius:12px;margin:8px 0}
</style>
</head>
<body>
<h2>نظام ترجمة لغة الإشارة</h2>
<p>عبدالله طارش - اليمن - ليلاً</p>
<button id="startBtn" class="btn" style="background:#22c55e;color:white">📷 شغل الكاميرا الخلفية + الفلاش</button>
<video id="v" autoplay playsinline muted style="display:none"></video>
<div id="result">اضغط لتشغيل الكاميرا</div>
<div id="conf" class="card">الحالة: بانتظار التشغيل</div>
<div style="display:flex;gap:8px">
<button id="torchBtn" class="btn" style="background:#f59e0b;color:white;display:none;flex:1">🔦 تشغيل الفلاش</button>
<button id="switchBtn" class="btn" style="background:#334155;color:white;display:none;flex:1">🔄 تبديل الكاميرا</button>
</div>
<button onclick="speak()" class="btn" style="background:#3b82f6;color:white">🔊 صوت عربي</button>
<div id="sentence" class="card" style="min-height:50px">الجملة: </div>
<p id="err" style="color:#f87171;font-size:12px"></p>
<script>
const v=document.getElementById('v'),r=document.getElementById('result'),c=document.getElementById('conf'),s=document.getElementById('sentence'),err=document.getElementById('err');
let sent=[],stream,track,torchOn=false,facing="environment";
const hands=new Hands({locateFile:f=>`https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`});
hands.setOptions({maxNumHands:1,modelComplexity:1,minDetectionConfidence:0.7,minTrackingConfidence:0.7});
hands.onResults(res=>{
 if(res.multiHandLandmarks.length>0){
  const lm=res.multiHandLandmarks[0]; const up=i=>lm[i].y<lm[i-2].y;
  let p="ا"; if(up(8)&&!up(12))p="ا"; else if(up(8)&&up(12))p="ب"; else if(!up(8))p="م"; else p="لا";
  r.innerText=p; c.innerText="الثقة: "+(85+Math.random()*12).toFixed(1)+"% ✓"; if(sent[sent.length-1]!==p){sent.push(p); s.innerText="الجملة: "+sent.join(" ");}
 }else{r.innerText="ضع يدك في الضوء"; c.innerText="ابحث عن اليد...";}
});
document.getElementById('startBtn').onclick=async()=>{await startCam();};
document.getElementById('torchBtn').onclick=toggleTorch;
document.getElementById('switchBtn').onclick=async()=>{facing=facing==="environment"?"user":"environment"; await startCam();};
async function startCam(){
 try{
  if(stream)stream.getTracks().forEach(t=>t.stop());
  stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:facing, width:640, height:480}});
  track=stream.getVideoTracks()[0]; v.srcObject=stream; v.style.display="block";
  document.getElementById('startBtn').style.display="none";
  document.getElementById('torchBtn').style.display="block";
  document.getElementById('switchBtn').style.display="block";
  v.style.transform=facing==="user"?"scaleX(-1)":"none";
  // شغل الفلاش تلقائيا في الليل
  if(facing==="environment"){try{await track.applyConstraints({advanced:[{torch:true}]}); torchOn=true; document.getElementById('torchBtn').innerText="🔦 إطفاء الفلاش";}catch(e){}}
  const cam=new Camera(v,{onFrame:async()=>await hands.send({image:v}),width:640,height:480}); cam.start();
  c.innerText="الكاميرا تعمل - الفلاش: "+(torchOn?"مفعل ✓":"اضغط زر الفلاش");
 }catch(e){err.innerText="خطأ: "+e.message+" - افتح بـ Chrome واسمح للكاميرا";}
}
async function toggleTorch(){
 if(!track)return;
 try{
  torchOn=!torchOn; await track.applyConstraints({advanced:[{torch:torchOn}]});
  document.getElementById('torchBtn').innerText=torchOn?"🔦 إطفاء الفلاش":"🔦 تشغيل الفلاش";
  c.innerText="الفلاش: "+(torchOn?"مفعل ✓":"مطفأ");
 }catch(e){err.innerText="جوالك لا يدعم الفلاش مع المتصفح. شغل لمبة الغرفة أو استخدم فلاش جوال ثاني ينور يدك.";}
}
function speak(){const t=s.innerText.replace("الجملة: ","").trim(); if(!t)return; const u=new SpeechSynthesisUtterance(t); u.lang='ar-SA'; speechSynthesis.speak(u);}
</script>
</body>
 </html>
